[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "greater-manchester-transport-data-platform"
version = "0.1.0"
description = "Greater Manchester public transport data engineering and service quality platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "jinja2>=3.1,<4.0",
    "mssql-python>=1.12,<2.0",
    "pandas>=3.0,<4.0",
    "pydantic-settings>=2.14,<3.0",
    "pyodbc>=5.3,<6.0",
    "uvicorn>=0.35,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["transport_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
