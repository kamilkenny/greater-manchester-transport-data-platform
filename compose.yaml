services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gm_transport_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${SQL_SERVER_MEMORY_LIMIT_MB:-2048}
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data:
